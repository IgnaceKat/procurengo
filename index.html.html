<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProcureNGO - Système de Gestion des Achats</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-primary: #0a0f1a;
      --bg-secondary: #111827;
      --bg-card: #1a2235;
      --bg-elevated: #243049;
      --fg-primary: #f1f5f9;
      --fg-secondary: #94a3b8;
      --fg-muted: #64748b;
      --accent: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #3b82f6;
      --border: #2d3a52;
      --sidebar-width: 260px;
    }

    * {
      font-family: 'DM Sans', sans-serif;
      box-sizing: border-box;
    }

    h1, h2, h3, .font-display {
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      background: var(--bg-primary);
      color: var(--fg-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .login-bg {
      background: 
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(16, 185, 129, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(59, 130, 246, 0.1), transparent),
        linear-gradient(180deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
    }

    .input-field {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
      outline: none;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      width: var(--sidebar-width);
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      border-right: 1px solid var(--border);
      z-index: 100;
      transform: translateX(0);
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .sidebar.collapsed {
      transform: translateX(-100%);
    }

    .nav-item {
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--fg-secondary);
      text-decoration: none;
      border-left: 3px solid transparent;
    }

    .nav-item:hover {
      background: var(--bg-elevated);
    }

    .nav-item.active {
      background: rgba(16, 185, 129, 0.15);
      border-left-color: var(--accent);
      color: var(--fg-primary);
    }

    .main-content {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
      transition: margin-left 0.3s ease;
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-header {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(17, 24, 39, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      z-index: 80;
      padding: 0 16px;
      align-items: center;
      justify-content: space-between;
    }

    .hamburger {
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--fg-primary);
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }

    .desktop-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(26, 34, 53, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .table-row { transition: background 0.2s ease; }
    .table-row:hover { background: var(--bg-elevated); }

    .status-pending { color: var(--warning); background: rgba(245, 158, 11, 0.15); }
    .status-approved { color: var(--accent); background: rgba(16, 185, 129, 0.15); }
    .status-rejected { color: var(--danger); background: rgba(239, 68, 68, 0.15); }
    .status-delayed { color: var(--danger); background: rgba(239, 68, 68, 0.15); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    }

    .animate-fadeIn { animation: fadeIn 0.4s ease forwards; }
    .animate-slideInRight { animation: slideInRight 0.4s ease forwards; }

    .progress-bar {
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
      transition: width 0.5s ease;
    }

    .modal-overlay {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
    }

    .modal-content {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
      overflow-y: auto;
    }

    .modal-body {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 640px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      margin: auto;
    }

    .mobile-cards { display: none; }
    .mobile-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }

    /* Demo Assistant Styles */
    .demo-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
      max-width: calc(100vw - 40px);
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      padding: 20px;
      z-index: 1000;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(16, 185, 129, 0.15);
      animation: slideInRight 0.4s ease forwards;
    }

    .demo-overlay .demo-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .demo-overlay .demo-avatar {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .demo-overlay .demo-progress {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
    }

    .demo-overlay .demo-progress-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #334155;
      transition: all 0.3s ease;
    }

    .demo-overlay .demo-progress-dot.active {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .demo-overlay .demo-progress-dot.completed {
      background: #10b981;
    }

    .demo-overlay .demo-speech {
      background: rgba(30, 41, 59, 0.5);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      position: relative;
    }

    .demo-overlay .demo-speech::before {
      content: '"';
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 24px;
      color: rgba(16, 185, 129, 0.5);
      font-family: Georgia, serif;
    }

    .demo-overlay .demo-highlight {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .demo-overlay .demo-highlight:hover {
      background: rgba(59, 130, 246, 0.25);
      transform: translateX(4px);
    }

    .demo-overlay .demo-highlight.pulse {
      animation: pulse-glow 2s infinite;
    }

    .highlight-target {
      position: relative;
      z-index: 999;
      animation: pulse-glow 2s infinite;
      border-radius: 8px;
    }

    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
      .mobile-header { display: flex; }
      .desktop-header { top: 60px; }
      .demo-overlay {
        bottom: 80px;
        right: 10px;
        left: 10px;
        width: auto;
      }
    }

    @media (max-width: 768px) {
      .desktop-table { display: none; }
      .mobile-cards { display: block; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-6 sm:mb-8 animate-fadeIn">
        <div class="inline-flex items-center gap-2 sm:gap-3 mb-3 sm:mb-4">
          <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
            <svg class="w-6 h-6 sm:w-7 sm:h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
          </div>
          <h1 class="text-2xl sm:text-3xl font-display font-bold text-white">ProcureNGO</h1>
        </div>
        <p class="text-sm sm:text-base text-slate-400">Systeme de Gestion Electronique des Achats</p>
      </div>

      <div class="card rounded-2xl p-6 sm:p-8 animate-fadeIn">
        <h2 class="font-display text-lg sm:text-xl font-semibold mb-5 sm:mb-6 text-center">Connexion</h2>
        
        <form id="loginForm" class="space-y-4 sm:space-y-5">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Adresse email</label>
            <input type="email" id="loginEmail" required class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-slate-500 text-base" placeholder="utilisateur@ong.org">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Mot de passe</label>
            <div class="relative">
              <input type="password" id="loginPassword" required class="input-field w-full px-4 py-3 rounded-lg text-white placeholder-slate-500 pr-12 text-base" placeholder="Mot de passe">
              <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white p-1">
                <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Role utilisateur</label>
            <select id="loginRole" required class="input-field w-full px-4 py-3 rounded-lg text-white cursor-pointer text-base">
              <option value="">Selectionnez un role</option>
              <option value="demandeur">Demandeur</option>
              <option value="manager">Manager</option>
              <option value="finance">Finance</option>
              <option value="procurement">Procurement Officer</option>
              <option value="admin">Administrateur</option>
            </select>
          </div>

          <button type="submit" class="btn-primary w-full py-3 rounded-lg font-semibold text-white text-base">Se connecter</button>
        </form>

        <div class="mt-5 sm:mt-6 pt-5 sm:pt-6 border-t border-slate-700">
          <p class="text-xs text-slate-500 text-center mb-3">Comptes de demonstration</p>
          <div class="grid grid-cols-2 gap-2 text-xs sm:text-sm" id="quickLoginButtons">
            <button onclick="quickLogin('demandeur')" class="px-3 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Demandeur</button>
            <button onclick="quickLogin('manager')" class="px-3 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Manager</button>
            <button onclick="quickLogin('finance')" class="px-3 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Finance</button>
            <button onclick="quickLogin('procurement')" class="px-3 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">Procurement</button>
          </div>
          
          <!-- Demo Launch Button -->
          <button onclick="startDemoFromLogin()" class="w-full mt-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-4 py-3 rounded-lg font-medium flex items-center justify-center gap-2 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Lancer la demonstration guidee
          </button>
        </div>
      </div>

      <p class="text-center text-slate-600 text-xs sm:text-sm mt-4 sm:mt-6 animate-fadeIn">ONG Internationale - Tous droits reserves 2025</p>
    </div>
  </div>

  <!-- Main Application -->
  <div id="mainApp" class="hidden">
    
    <header class="mobile-header">
      <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <span class="font-display font-semibold text-white">ProcureNGO</span>
      </div>
      <button class="w-10 h-10 flex items-center justify-center text-slate-400">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
      </button>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <aside class="sidebar" id="sidebar">
      <div class="p-4 sm:p-5 border-b border-slate-700/50">
        <div class="flex items-center gap-2 sm:gap-3">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center">
            <svg class="w-5 h-5 sm:w-6 sm:h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
          </div>
          <div class="flex-1 min-w-0">
            <h1 class="font-display font-bold text-white text-sm sm:text-base">ProcureNGO</h1>
            <p class="text-xs text-slate-500">v2.4.1</p>
          </div>
          <button class="lg:hidden p-2 text-slate-400 hover:text-white" onclick="closeSidebar()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
      </div>

      <nav class="flex-1 py-2 sm:py-4 overflow-y-auto">
        <div class="px-4 py-2 mb-1"><span class="text-[10px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wider">Principal</span></div>
        
        <button onclick="showModule('dashboard')" data-nav="dashboard" class="nav-item active w-full">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          <span class="text-sm">Tableau de bord</span>
        </button>

        <button onclick="showModule('requisitions')" data-nav="requisitions" class="nav-item w-full">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <span class="text-sm">Requisitions</span>
          <span class="ml-auto bg-emerald-500/20 text-emerald-400 text-xs px-2 py-0.5 rounded-full">3</span>
        </button>

        <button onclick="showModule('workflow')" data-nav="workflow" class="nav-item w-full">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span class="text-sm">Workflow</span>
        </button>

        <button onclick="showModule('tracking')" data-nav="tracking" class="nav-item w-full">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span class="text-sm">Suivi achats</span>
        </button>

        <div class="px-4 py-2 mt-4 sm:mt-6 mb-1"><span class="text-[10px] sm:text-xs font-semibold text-slate-500 uppercase tracking-wider">Gestion</span></div>

    // ==================== INITIALIZATION ====================
    document.addEventListener('DOMContentLoaded', function() {
      updateDate();
      setInterval(updateDate, 60000);
      window.addEventListener('resize', handleResize);
      handleResize();
    });

    function handleResize() {
      const isMobile = window.innerWidth <= 1024;
      if (!isMobile && AppState.sidebarOpen) closeSidebar();
    }

    function updateDate() {
      const now = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const el = document.getElementById('currentDate');
      if (el) el.textContent = now.toLocaleDateString('fr-FR', options);
    }

    // ==================== DEMO FUNCTIONS ====================
    function startDemoFromLogin() {
      demoState.active = true;
      demoState.currentStep = 0;
      showDemoStep();
    }

    function startDemo() {
      demoState.active = true;
      demoState.currentStep = 1;
      showDemoStep();
    }

    function toggleDemo() {
      if (demoState.active) {
        endDemo();
      } else {
        startDemo();
      }
    }

    function endDemo() {
      demoState.active = false;
      demoState.currentStep = 0;
      const overlay = document.getElementById('demoOverlay');
      if (overlay) overlay.innerHTML = '';
      removeHighlights();
      updateDemoButton();
    }

    function showDemoStep() {
      if (!demoState.active || demoState.currentStep >= DEMO_SCRIPT.length) {
        endDemo();
        return;
      }

      const step = DEMO_SCRIPT[demoState.currentStep];
      const overlay = document.getElementById('demoOverlay');
      
      removeHighlights();
      
      let highlightTarget = null;
      if (step.target) {
        if (step.action === 'login') {
          // Highlight login buttons
          const buttons = document.querySelectorAll('#quickLoginButtons button');
          buttons.forEach(btn => btn.classList.add('highlight-target'));
        } else {
          highlightTarget = document.querySelector(`[data-nav="${step.target}"]`);
          if (highlightTarget) {
            highlightTarget.classList.add('highlight-target');
          }
        }
      }

      overlay.innerHTML = `
        <div class="demo-overlay">
          <div class="demo-header">
            <div class="demo-avatar">
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
            </div>
            <div class="flex-1">
              <h3 class="text-emerald-400 font-bold text-sm">Etape ${step.step}/${DEMO_SCRIPT.length}</h3>
              <p class="text-white font-semibold">${step.title}</p>
            </div>
            <button onclick="endDemo()" class="p-2 text-slate-400 hover:text-white hover:bg-slate-700 rounded-lg transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
          
          <div class="demo-progress">
            ${DEMO_SCRIPT.map((s, i) => `
              <div class="demo-progress-dot ${i < demoState.currentStep ? 'completed' : ''} ${i === demoState.currentStep ? 'active' : ''}"></div>
            `).join('')}
          </div>
          
          <div class="demo-speech">
            <p class="text-slate-300 text-sm leading-relaxed">${step.message}</p>
          </div>
          
          ${step.target ? `
            <div class="demo-highlight pulse" onclick="executeDemoAction('${step.action}', '${step.target || ''}')">
              <svg class="w-4 h-4 text-blue-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              </svg>
              <span class="text-sm text-slate-200">${step.instruction}</span>
              <svg class="w-4 h-4 text-blue-400 ml-auto flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">

              <p class="text-sm text-slate-300">${step.instruction}</p>
            </div>
          `}

            ${demoState.currentStep > 0 ? `
              <button onclick="prevDemoStep()" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-600 text-slate-300 hover:bg-slate-700 transition text-sm">

              </button>

            <button onclick="nextDemoStep()" class="flex-1 btn-primary px-4 py-2.5 rounded-lg font-medium text-white text-sm">
              ${step.action === 'end' ? 'Terminer' : 'Suivant'}

          </div>

      updateDemoButton();

    function executeDemoAction(action, target) {
      removeHighlights();
      
      if (action === 'login') {
        quickLogin('manager');
        setTimeout(() => {
          demoState.currentStep++;
          showDemoStep();
        }, 500);
      } else if (action === 'navigate' && target) {
        showModule(target);
        setTimeout(() => {
          demoState.currentStep++;
          showDemoStep();
        }, 300);
      }
    }

    function nextDemoStep() {
      demoState.currentStep++;
      if (demoState.currentStep >= DEMO_SCRIPT.length) {
        endDemo();
      } else {
        showDemoStep();
      }
    }

    function prevDemoStep() {
      if (demoState.currentStep > 0) {
        demoState.currentStep--;
        showDemoStep();
      }
    }

    function removeHighlights() {
      document.querySelectorAll('.highlight-target').forEach(el => {
        el.classList.remove('highlight-target');
      });
    }

    function updateDemoButton() {
      const btn = document.getElementById('demoToggleBtn');
      const text = document.getElementById('demoBtnText');
      if (btn && text) {
        if (demoState.active) {
          text.textContent = 'Arreter la demo';
          btn.classList.remove('from-blue-600', 'to-indigo-600', 'hover:from-blue-700', 'hover:to-indigo-700');
          btn.classList.add('from-red-600', 'to-rose-600', 'hover:from-red-700', 'hover:to-rose-700');
        } else {
          text.textContent = 'Demo guidee';
          btn.classList.add('from-blue-600', 'to-indigo-600', 'hover:from-blue-700', 'hover:to-indigo-700');
          btn.classList.remove('from-red-600', 'to-rose-600', 'hover:from-red-700', 'hover:to-rose-700');
        }
      }
    }

    // ==================== SIDEBAR ====================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const hamburger = document.getElementById('hamburgerBtn');
      
      AppState.sidebarOpen = !AppState.sidebarOpen;
      
      if (AppState.sidebarOpen) {
        sidebar.classList.add('open');
        overlay.classList.add('active');
        hamburger.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        closeSidebar();
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const hamburger = document.getElementById('hamburgerBtn');
      
      AppState.sidebarOpen = false;
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      hamburger.classList.remove('active');
      document.body.style.overflow = '';
    }

      const input = document.getElementById('loginPassword');
      const icon = document.getElementById('eyeIcon');

    // ==================== NAVIGATION ====================
    function showModule(moduleName) {
      AppState.currentModule = moduleName;
      if (window.innerWidth <= 1024) closeSidebar();
      
      document.querySelectorAll('[data-nav]').forEach(btn => btn.classList.remove('active'));
      const activeNav = document.querySelector(`[data-nav="${moduleName}"]`);
      if (activeNav) activeNav.classList.add('active');

      const titles = {
        dashboard: { title: 'Tableau de bord', subtitle: 'Vue d\'ensemble des activites d\'achat' },
        requisitions: { title: 'Requisitions d\'achat', subtitle: 'Gestion des demandes d\'achat' },
        workflow: { title: 'Workflow de validation', subtitle: 'Processus d\'approbation' },
        tracking: { title: 'Suivi des achats', subtitle: 'Suivi des commandes en cours' },
        suppliers: { title: 'Gestion fournisseurs', subtitle: 'Annuaire et performance' },
        grn: { title: 'Reception (GRN)', subtitle: 'Goods Receipt Note' },
        reporting: { title: 'Rapports & Analytics', subtitle: 'Statistiques et export' },
        archive: { title: 'Archives documentaires', subtitle: 'Recherche et historique' },
        users: { title: 'Gestion utilisateurs', subtitle: 'Comptes et permissions' }
      };

      const pageInfo = titles[moduleName] || { title: moduleName, subtitle: '' };
      document.getElementById('pageTitle').textContent = pageInfo.title;
      document.getElementById('pageSubtitle').textContent = pageInfo.subtitle;

      const content = document.getElementById('contentArea');
      content.innerHTML = '';
      content.classList.add('animate-fadeIn');
      
      switch(moduleName) {
        case 'dashboard': renderDashboard(); break;
        case 'requisitions': renderRequisitions(); break;
        case 'workflow': renderWorkflow(); break;
        case 'tracking': renderTracking(); break;
        case 'suppliers': renderSuppliers(); break;
        case 'grn': renderGRN(); break;
        case 'reporting': renderReporting(); break;
        case 'archive': renderArchive(); break;
        case 'users': renderUsers(); break;
      }
    }

        rejected: AppState.requisitions.filter(r => r.status === 'rejected').length,
        delayed: AppState.requisitions.filter(r => r.status === 'delayed').length

            <button class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-lg hover:bg-slate-800 transition">
              <div class="w-10 h-10 rounded-lg bg-red-500/20 flex items-center justify-center"><svg class="w-5 h-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg></div>
              <div class="text-left"><p class="text-sm font-medium text-white">Export PDF</p><p class="text-xs text-slate-500">Rapport complet</p></div>
            </button>
            <button class="flex items-center gap-3 p-4 bg-slate-800/50 rounded-lg hover:bg-slate-800 transition">
              <div class="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center"><svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg></div>
              <div class="text-left"><p class="text-sm font-medium text-white">Export Excel</p><p class="text-xs text-slate-500">Donnees brutes</p></div>
            </button>
          </div>
        </div>
      `;
    }

    function renderArchive() {
      const content = document.getElementById('contentArea');
      content.innerHTML = `
        <div class="card rounded-xl p-4 sm:p-6 mb-6">
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" placeholder="Rechercher par ID, description..." class="input-field flex-1 px-4 py-3 rounded-lg text-sm">
            <button class="btn-primary px-6 py-3 rounded-lg font-medium text-white text-sm">Rechercher</button>
          </div>
        </div>
        <div class="card rounded-xl p-4 sm:p-6">
          <h3 class="font-display font-semibold text-white mb-4">Documents archives (${AppState.requisitions.length})</h3>
          <div class="space-y-3">
            ${AppState.requisitions.slice(0, 5).map(req => `
              <div class="flex items-center gap-4 p-4 bg-slate-800/50 rounded-lg">
                <div class="w-10 h-10 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                  <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <div class="flex-1">
                  <span class="font-mono text-sm text-emerald-400">${req.id}</span>
                  <p class="text-sm text-slate-300">${req.description}</p>
                </div>
                <span class="px-2 py-1 text-xs rounded-full ${getStatusClass(req.status)}">${getStatusLabel(req.status)}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderUsers() {
      const content = document.getElementById('contentArea');
      const roleColors = { demandeur: 'bg-blue-500/20 text-blue-400', manager: 'bg-purple-500/20 text-purple-400', finance: 'bg-amber-500/20 text-amber-400', procurement: 'bg-emerald-500/20 text-emerald-400', admin: 'bg-red-500/20 text-red-400' };
      const roleLabels = { demandeur: 'Demandeur', manager: 'Manager', finance: 'Finance', procurement: 'Procurement', admin: 'Admin' };
      content.innerHTML = `
        <div class="card rounded-xl p-4 sm:p-6">
          <h3 class="font-display font-semibold text-white mb-4">Utilisateurs actifs</h3>
          <div class="space-y-3">
            ${AppState.users.map(user => `
              <div class="flex items-center gap-4 p-4 bg-slate-800/50 rounded-lg">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-semibold">${user.name.split(' ').map(n => n[0]).join('')}</div>
                <div class="flex-1">
                  <p class="text-sm font-medium text-white">${user.name}</p>
                  <p class="text-xs text-slate-500">${user.email}</p>
                </div>
                <span class="px-2 py-1 text-xs rounded-full ${roleColors[user.role]}">${roleLabels[user.role]}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==================== UTILITIES ====================
    function getStatusClass(status) {
      const classes = { 'pending_manager': 'status-pending', 'pending_finance': 'status-pending', 'pending_procurement': 'status-pending', 'approved': 'status-approved', 'rejected': 'status-rejected', 'delayed': 'status-delayed' };
      return classes[status] || 'status-pending';
    }

    function getStatusLabel(status) {
      const labels = { 'pending_manager': 'En attente Manager', 'pending_finance': 'En attente Finance', 'pending_procurement': 'En attente Achats', 'approved': 'Approuve', 'rejected': 'Rejete', 'delayed': 'En retard' };
      return labels[status] || status;
    }

    function getNotificationIcon(type) {
      const icons = {
        approval: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        delay: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>',
        success: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
        info: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
      };
      return icons[type] || icons.info;
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', minimumFractionDigits: 0 }).format(amount);
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function closeModal() {
      document.getElementById('modalContainer').classList.add('hidden');
    }

    function viewRequisition(id) {
      const req = AppState.requisitions.find(r => r.id === id);
      if (!req) return;
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <h3 class="font-display text-lg font-semibold text-white">${req.id}</h3>
          <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          <div class="p-3 bg-slate-800/50 rounded-lg"><p class="text-xs text-slate-500">Demandeur</p><p class="text-sm text-white">${req.requester}</p></div>
          <div class="p-3 bg-slate-800/50 rounded-lg"><p class="text-xs text-slate-500">Budget</p><p class="text-sm text-emerald-400">${formatCurrency(req.budget)}</p></div>
        </div>
        <p class="text-sm text-slate-300 mb-4">${req.description}</p>
        <button onclick="closeModal()" class="w-full btn-primary py-2.5 rounded-lg font-medium text-white text-sm">Fermer</button>
      `;
      document.getElementById('modalContainer').classList.remove('hidden');
    }

    function openNewRequisitionModal() {
      const modalBody = document.getElementById('modalBody');
      modalBody.innerHTML = `
        <div class="flex items-center justify-between mb-5">
          <h3 class="font-display text-lg font-semibold text-white">Nouvelle requisition</h3>
          <button onclick="closeModal()" class="p-2 text-slate-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
        </div>
        <form class="space-y-4">
          <div><label class="block text-sm font-medium text-slate-300 mb-2">Description</label><textarea rows="3" class="input-field w-full px-4 py-2.5 rounded-lg text-sm" placeholder="Description..."></textarea></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="block text-sm font-medium text-slate-300 mb-2">Quantite</label><input type="number" class="input-field w-full px-4 py-2.5 rounded-lg text-sm" placeholder="0"></div>
            <div><label class="block text-sm font-medium text-slate-300 mb-2">Budget (EUR)</label><input type="number" class="input-field w-full px-4 py-2.5 rounded-lg text-sm" placeholder="0"></div>
          </div>
          <div class="flex gap-3 pt-4">
            <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2.5 rounded-lg border border-slate-600 text-slate-300 text-sm">Annuler</button>
            <button type="submit" class="flex-1 btn-primary px-4 py-2.5 rounded-lg font-medium text-white text-sm" onclick="event.preventDefault(); alert('Requisition creee!'); closeModal();">Soumettre</button>
          </div>
        </form>
      `;
      document.getElementById('modalContainer').classList.remove('hidden');
    }
  </script>
</body>
</html>
